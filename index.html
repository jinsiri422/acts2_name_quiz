<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤍 사랑으로 하나되는 Acts2부</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif;background:#fdf6fb;color:#222;min-height:100vh;}

/* ── 헤더 ── */
.site-header{background:#fff;border-bottom:1px solid #f0e0ec;padding:16px 20px;text-align:center;position:sticky;top:0;z-index:50;}
.site-header h1{font-size:18px;font-weight:700;color:#c2427a;letter-spacing:-0.3px;}
.site-header p{font-size:12px;color:#aaa;margin-top:2px;}
.admin-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:#fff0f6;border:1px solid #f0c0d8;border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;color:#c2427a;}
.admin-btn:hover{background:#fde0ef;}

/* ── 탭 ── */
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #f0e0ec;overflow-x:auto;}
.tab-btn{flex:1;padding:12px 8px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:#aaa;border-bottom:2px solid transparent;white-space:nowrap;min-width:70px;}
.tab-btn.active{color:#c2427a;border-bottom-color:#c2427a;}

/* ── 관리자 패널 ── */
.admin-bar{display:none;background:#fff5fa;border-bottom:1px solid #f0c0d8;padding:10px 16px;gap:8px;align-items:center;flex-wrap:wrap;}
.admin-bar.show{display:flex;}
.admin-badge{background:#fde0ef;color:#c2427a;border:1px solid #f0c0d8;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.btn-add{background:#c2427a;color:#fff;border:none;padding:7px 14px;border-radius:20px;font-size:12px;cursor:pointer;}
.btn-add:hover{background:#a83468;}
.btn-logout{background:#fff;border:1px solid #ddd;color:#888;padding:7px 14px;border-radius:20px;font-size:12px;cursor:pointer;}

/* ── 통계 바 ── */
.stat-bar{display:flex;gap:0;background:#fff;border-bottom:1px solid #f0e0ec;}
.stat-item{flex:1;padding:10px 4px;text-align:center;border-right:1px solid #f5f0f3;}
.stat-item:last-child{border-right:none;}
.stat-num{font-size:18px;font-weight:700;color:#c2427a;}
.stat-lbl{font-size:11px;color:#aaa;margin-top:1px;}

/* ── 필터 ── */
.filter-bar{padding:10px 14px;background:#fff;border-bottom:1px solid #f0e0ec;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.filter-chip{padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid #e0d0e8;background:#faf5fc;color:#888;}
.filter-chip.active{background:#fde0ef;border-color:#e07aaa;color:#a02060;}
.filter-lbl{font-size:12px;color:#bbb;}

/* ── 섹션 ── */
.section-page{display:none;padding:14px;}
.section-page.active{display:block;}
.section-title{font-size:12px;font-weight:600;color:#bbb;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px 2px;}

/* ── 멤버 그리드 ── */
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;}
.member-card{background:#fff;border:1px solid #f0e8f5;border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;transition:border-color .15s,transform .1s;position:relative;}
.member-card:hover{border-color:#e07aaa;transform:translateY(-1px);}
.avatar{width:60px;height:60px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.member-name{font-size:13px;font-weight:600;color:#333;margin-bottom:3px;}
.member-sub{font-size:11px;color:#aaa;}
.role-badge{display:inline-block;margin-top:5px;padding:2px 7px;border-radius:10px;font-size:10px;}

/* 팸 색상 */
.fam-종현팸{background:#e8f0fd;color:#2a50a0;}
.fam-재호팸{background:#fde8f2;color:#a03060;}
.fam-향팸{background:#e8fdf2;color:#207a50;}
.fam-임원단팸{background:#fef2e8;color:#a05020;}
.fam-스탭{background:#f5e8fe;color:#602080;}
.fam-새가족팸{background:#fefde8;color:#806000;}

/* 관리자 수정 버튼 */
.edit-actions{position:absolute;top:6px;right:6px;display:none;gap:3px;}
.admin-mode .edit-actions{display:flex;}
.edit-btn{width:22px;height:22px;border-radius:50%;border:1px solid #eee;background:#fff;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;color:#999;}
.edit-btn.del:hover{background:#ffeeee;color:#e05050;}
.edit-btn.edt:hover{background:#eef0ff;color:#5070d0;}

/* ── 퀴즈 ── */
.quiz-wrap{padding:16px;}
.quiz-mode-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.quiz-mode-btn{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid #e0d0e8;background:#faf5fc;color:#888;}
.quiz-mode-btn.active{background:#fde0ef;border-color:#e07aaa;color:#a02060;font-weight:600;}
.quiz-sub-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}

.quiz-score-bar{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #f0e8f5;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;}
.quiz-score-num{font-size:18px;font-weight:700;color:#c2427a;}
.quiz-progress{height:4px;background:#f0e0ec;border-radius:2px;margin-bottom:16px;overflow:hidden;}
.quiz-progress-fill{height:100%;background:#e07aaa;border-radius:2px;transition:width .3s;}

.photo-card{background:#fff;border:1px solid #f0e8f5;border-radius:16px;padding:24px 16px;text-align:center;margin-bottom:14px;}
.quiz-avatar{width:110px;height:110px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;overflow:hidden;}
.quiz-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.quiz-hint{font-size:12px;color:#bbb;margin-top:4px;}

.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.option-btn{background:#fff;border:1px solid #e0d8ec;border-radius:12px;padding:14px 10px;font-size:14px;font-weight:600;cursor:pointer;color:#333;transition:all .12s;min-height:50px;}
.option-btn:hover:not(:disabled){background:#fff0f8;border-color:#e07aaa;}
.option-btn.correct{background:#e8fdf2;border-color:#1D9E75;color:#0a6e40;}
.option-btn.wrong{background:#ffeeee;border-color:#e05050;color:#a02020;}
.option-btn.reveal{background:#e8fdf2;border-color:#1D9E75;color:#0a6e40;}
.option-btn:disabled{cursor:default;}

.quiz-feedback{text-align:center;font-size:15px;font-weight:600;min-height:26px;margin-bottom:8px;}
.quiz-feedback.ok{color:#0a6e40;}
.quiz-feedback.ng{color:#a02020;}
.next-btn{width:100%;padding:13px;border-radius:12px;background:#c2427a;border:none;color:#fff;font-size:15px;font-weight:600;cursor:pointer;display:none;}
.next-btn.show{display:block;}
.next-btn:hover{background:#a83468;}

.result-box{text-align:center;padding:36px 20px;}
.result-emoji{font-size:52px;margin-bottom:14px;}
.result-title{font-size:22px;font-weight:700;margin-bottom:6px;}
.result-score{font-size:44px;font-weight:700;color:#c2427a;margin:10px 0;}
.result-sub{font-size:14px;color:#aaa;margin-bottom:24px;}
.retry-btn{padding:12px 32px;border-radius:24px;background:#c2427a;border:none;color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.retry-btn:hover{background:#a83468;}

/* ── 모달 공통 ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:20px;padding:24px;width:340px;max-width:93vw;max-height:90vh;overflow-y:auto;}
.modal h2{font-size:18px;font-weight:700;margin-bottom:4px;color:#333;}
.modal p{font-size:13px;color:#aaa;margin-bottom:16px;}

/* PIN */
.pin-row{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
.pin-box{width:48px;height:54px;border-radius:12px;border:1.5px solid #e0d0e8;font-size:24px;text-align:center;background:#faf5fc;color:#333;}
.pin-box:focus{outline:none;border-color:#c2427a;box-shadow:0 0 0 3px rgba(194,66,122,.15);}
.pin-err{color:#e05050;font-size:12px;text-align:center;margin-bottom:10px;display:none;}

/* 폼 */
.form-row{margin-bottom:12px;}
.form-row label{display:block;font-size:12px;color:#aaa;margin-bottom:4px;}
.form-row input,.form-row select{width:100%;padding:9px 12px;border-radius:10px;border:1.5px solid #e0d0e8;font-size:14px;background:#faf5fc;color:#333;}
.form-row input:focus,.form-row select:focus{outline:none;border-color:#c2427a;}

.btn-primary{width:100%;padding:12px;border-radius:12px;background:#c2427a;border:none;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;}
.btn-primary:hover{background:#a83468;}
.btn-cancel{width:100%;padding:11px;border-radius:12px;background:#f5f5f5;border:1.5px solid #e8e8e8;color:#888;font-size:14px;cursor:pointer;margin-top:8px;}

/* 멤버 상세 */
.detail-card{text-align:center;}
.detail-avatar{width:90px;height:90px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;overflow:hidden;}
.detail-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.detail-name{font-size:22px;font-weight:700;margin-bottom:6px;}
.detail-info{font-size:13px;color:#888;line-height:1.9;}
.detail-tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.detail-tag{padding:4px 12px;border-radius:20px;font-size:12px;}
.close-btn{margin-top:18px;padding:9px 28px;border-radius:20px;border:1.5px solid #e0d0e8;background:#faf5fc;cursor:pointer;font-size:13px;color:#888;}

/* 로딩 */
.loading{text-align:center;padding:48px 20px;color:#ccc;font-size:14px;}
.loading-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e07aaa;margin:0 3px;animation:bounce .9s infinite;}
.loading-dot:nth-child(2){animation-delay:.2s;}
.loading-dot:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-8px);}}
</style>
</head>
<body>

<div class="site-header">
  <h1>🤍 사랑으로 하나되는 Acts2부</h1>
  <p>멤버 <span id="total-cnt">-</span>명</p>
  <button class="admin-btn" onclick="openPinModal()">관리자</button>
</div>

<div class="admin-bar" id="admin-bar">
  <span class="admin-badge">관리자 모드</span>
  <button class="btn-add" onclick="openMemberForm()">+ 멤버 추가</button>
  <button class="btn-add" style="background:#5070d0;" onclick="uploadAllToFirebase()">DB 초기 업로드</button>
  <button class="btn-logout" onclick="doLogout()">로그아웃</button>
</div>

<div class="stat-bar" id="stat-bar">
  <div class="stat-item"><div class="stat-num" id="s-total">-</div><div class="stat-lbl">전체</div></div>
  <div class="stat-item"><div class="stat-num" id="s-jh">-</div><div class="stat-lbl">종현팸</div></div>
  <div class="stat-item"><div class="stat-num" id="s-jh2">-</div><div class="stat-lbl">재호팸</div></div>
  <div class="stat-item"><div class="stat-num" id="s-h">-</div><div class="stat-lbl">향팸</div></div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('all')">전체</button>
  <button class="tab-btn" onclick="switchTab('fam')">팸별</button>
  <button class="tab-btn" onclick="switchTab('age')">또래별</button>
  <button class="tab-btn" onclick="switchTab('cell')">셀별</button>
  <button class="tab-btn" onclick="switchTab('quiz')">얼굴퀴즈</button>
</div>

<div id="filter-bar" class="filter-bar" style="display:none;"></div>

<!-- 전체/팸별/또래별/셀별 -->
<div id="page-all" class="section-page active"></div>
<div id="page-fam" class="section-page"></div>
<div id="page-age" class="section-page"></div>
<div id="page-cell" class="section-page"></div>

<!-- 퀴즈 -->
<div id="page-quiz" class="section-page">
  <div class="quiz-wrap">
    <div class="quiz-mode-bar">
      <button class="quiz-mode-btn active" onclick="setQuizMode('all')" id="qm-all">전체</button>
      <button class="quiz-mode-btn" onclick="setQuizMode('종현팸')" id="qm-종현팸">종현팸</button>
      <button class="quiz-mode-btn" onclick="setQuizMode('재호팸')" id="qm-재호팸">재호팸</button>
      <button class="quiz-mode-btn" onclick="setQuizMode('향팸')" id="qm-향팸">향팸</button>
      <button class="quiz-mode-btn" onclick="setQuizMode('age')" id="qm-age">또래별</button>
    </div>
    <div class="quiz-sub-bar" id="quiz-sub-bar"></div>
    <div id="quiz-score-bar" class="quiz-score-bar">
      <div><span style="color:#aaa;font-size:12px;">점수 </span><span class="quiz-score-num" id="q-score">0</span><span style="color:#aaa;font-size:12px;"> / <span id="q-total">0</span></span></div>
      <div style="font-size:12px;color:#aaa;">연속 <span id="q-streak" style="color:#e07aaa;font-weight:700;">0</span></div>
      <div style="font-size:12px;color:#bbb;" id="q-num"></div>
    </div>
    <div class="quiz-progress"><div class="quiz-progress-fill" id="q-prog" style="width:0%"></div></div>

    <div id="quiz-main">
      <div class="photo-card">
        <div style="font-size:11px;color:#bbb;margin-bottom:12px;">이 사람은 누구일까요?</div>
        <div class="quiz-avatar" id="q-avatar"></div>
        <div class="quiz-hint" id="q-hint"></div>
      </div>
      <div class="options-grid" id="q-opts"></div>
      <div class="quiz-feedback" id="q-fb"></div>
      <button class="next-btn" id="q-next" onclick="nextQuestion()">다음 문제</button>
    </div>
    <div class="result-box" id="quiz-result" style="display:none;">
      <div class="result-emoji" id="r-emoji"></div>
      <div class="result-title" id="r-title"></div>
      <div class="result-score" id="r-score"></div>
      <div class="result-sub" id="r-sub"></div>
      <button class="retry-btn" onclick="startQuiz()">다시 풀기</button>
    </div>
  </div>
</div>

<!-- PIN 모달 -->
<div class="overlay" id="pin-overlay">
  <div class="modal">
    <h2>관리자 로그인</h2>
    <p>4자리 PIN을 입력해 주세요</p>
    <div class="pin-row">
      <input class="pin-box" type="password" maxlength="1" id="p0" oninput="nextPin(0)" onkeydown="backPin(event,0)">
      <input class="pin-box" type="password" maxlength="1" id="p1" oninput="nextPin(1)" onkeydown="backPin(event,1)">
      <input class="pin-box" type="password" maxlength="1" id="p2" oninput="nextPin(2)" onkeydown="backPin(event,2)">
      <input class="pin-box" type="password" maxlength="1" id="p3" oninput="nextPin(3)" onkeydown="backPin(event,3)">
    </div>
    <div class="pin-err" id="pin-err">PIN이 틀렸어요</div>
    <button class="btn-primary" onclick="checkPin()">확인</button>
    <button class="btn-cancel" onclick="closePinModal()">취소</button>
  </div>
</div>

<!-- 멤버 추가/수정 모달 -->
<div class="overlay" id="form-overlay">
  <div class="modal">
    <h2 id="form-title">멤버 추가</h2>
    <p id="form-sub">새 멤버 정보를 입력해 주세요</p>
    <div class="form-row"><label>이름 *</label><input id="f-name" placeholder="이름"></div>
    <div class="form-row"><label>팸 *</label>
      <select id="f-fam">
        <option value="">선택</option>
        <option>종현팸</option><option>재호팸</option><option>향팸</option>
        <option>임원단팸</option><option>스탭</option><option>새가족팸</option>
      </select>
    </div>
    <div class="form-row"><label>셀</label><input id="f-cell" placeholder="예: 채영 & 하영셀"></div>
    <div class="form-row"><label>출생연도 *</label><input id="f-year" type="number" placeholder="예: 2001" min="1990" max="2010"></div>
    <div class="form-row"><label>성별</label>
      <select id="f-gender"><option value="">선택</option><option>남</option><option>여</option></select>
    </div>
    <div class="form-row"><label>직책</label><input id="f-role" placeholder="예: 리더, 셀원"></div>
    <div class="form-row"><label>사진 URL</label><input id="f-photo" placeholder="구글 드라이브 링크 붙여넣기"></div>
    <input type="hidden" id="f-docid">
    <button class="btn-primary" onclick="saveMember()">저장</button>
    <button class="btn-cancel" onclick="closeForm()">취소</button>
  </div>
</div>

<!-- 멤버 상세 모달 -->
<div class="overlay" id="detail-overlay" onclick="closeDetailIfBg(event)">
  <div class="modal detail-card" id="detail-box"></div>
</div>

const FAM_STYLE = {
  "종현팸":{bg:"#dce8fd",color:"#2a50a0"},
  "재호팸":{bg:"#fddce8",color:"#a03060"},

  "스탭":{bg:"#eeddf5",color:"#602080"},

};
function famStyle(fam){return FAM_STYLE[fam]||{bg:"#f0eaf5",color:"#665577"};}

// ── 나이 ──
function getAge(y){return 2026-y+1;}
function ageGroup(y){
  const yy=String(y).slice(2);
  return yy+"또래";
}

// ── 아바타 HTML ──
function avatarHtml(m,size=60){
  const s=famStyle(m.fam);
  const ini=m.name.slice(0,2);
  const imgPart=m.photo?`<img src="${m.photo}" onerror="this.style.display='none'">`:'';
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${s.bg};color:${s.color};font-size:${Math.round(size*0.3)}px;">${imgPart}${m.photo?'':ini}</div>`;
}

// ── 상태 ──
let members = [];
let isAdmin = false;
let currentTab = 'all';
let activeFilter = null;

// ── Firebase 실시간 리스너 ──
async function startFirebaseListener(){
  // Firebase에 데이터 없으면 자동 업로드
  const check = await db.collection('members').limit(1).get().catch(()=>null);
  if(check && check.empty){
    const existingSnap = await db.collection('members').get();
    const existingNames = new Set(existingSnap.docs.map(d=>d.data().name));
    const toUpload = INIT_MEMBERS.filter(m=>!existingNames.has(m.name));
    if(toUpload.length>0){
      const chunks=[];
      for(let i=0;i<toUpload.length;i+=500)chunks.push(toUpload.slice(i,i+500));
      for(const chunk of chunks){
        const batch=db.batch();
        chunk.forEach(m=>{batch.set(db.collection('members').doc(),m);});
        await batch.commit();
      }
    }
  }
  // 실시간 리스너 시작
  db.collection('members').orderBy('fam').onSnapshot(snap=>{
    members = snap.docs.map(d=>({docId:d.id,...d.data()}));
    updateStats();
    renderCurrentTab();
  }, err=>{
    console.error(err);
    if(members.length===0){
      members = INIT_MEMBERS.map((m,i)=>({docId:'local_'+i,...m}));
      updateStats();
      renderCurrentTab();
    }
  });
}

// ── 초기 업로드 (관리자만) ──
async function uploadAllToFirebase(){
  if(!isAdmin){alert('관리자만 가능해요');return;}
  if(!confirm('중복 체크 후 새 멤버만 업로드할게요. 진행할까요?'))return;
  const existingSnap = await db.collection('members').get();
  const existingNames = new Set(existingSnap.docs.map(d=>d.data().name));
  const toUpload = INIT_MEMBERS.filter(m=>!existingNames.has(m.name));
  const skipped = INIT_MEMBERS.length - toUpload.length;
  if(toUpload.length===0){
    alert('모든 멤버가 이미 등록되어 있어요!\n(' + skipped + '명 중복 건너뜀)');
    return;
  }
  const chunks=[];
  for(let i=0;i<toUpload.length;i+=500)chunks.push(toUpload.slice(i,i+500));
  for(const chunk of chunks){
    const batch=db.batch();
    chunk.forEach(m=>{batch.set(db.collection('members').doc(),m);});
    await batch.commit();
  }
  alert('업로드 완료!\n✅ 새로 추가: ' + toUpload.length + '명\n⏭ 중복 건너뜀: ' + skipped + '명');
}

function updateStats(){
  const total=members.length;
  document.getElementById('total-cnt').textContent=total;
  document.getElementById('s-total').textContent=total;

// ── 탭 전환 ──
function switchTab(tab){
  currentTab=tab; activeFilter=null;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.textContent.trim()===
    {all:'전체',fam:'팸별',age:'또래별',cell:'셀별',quiz:'얼굴퀴즈'}[tab]));
  document.querySelectorAll('.section-page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  if(tab==='quiz'){document.getElementById('filter-bar').style.display='none'; startQuiz(); return;}
  renderCurrentTab();
}

function renderCurrentTab(){
  if(currentTab==='quiz')return;
  const page=document.getElementById('page-'+currentTab);
  if(currentTab==='all'){
    document.getElementById('filter-bar').style.display='none';
    page.innerHTML=renderGrid(members);
    return;
  }
  // 그룹핑
  let groupFn;
  if(currentTab==='fam') groupFn=m=>m.fam;
  else if(currentTab==='age') groupFn=m=>ageGroup(m.year);
  else groupFn=m=>m.cell;

  const groups={};
  members.forEach(m=>{const k=groupFn(m);if(!groups[k])groups[k]=[];groups[k].push(m);});
  const keys=Object.keys(groups).sort((a,b)=>{
    if(currentTab==='age'){
      const order=['98또래','99또래','00또래','01또래','02또래','03또래','04또래','05또래','06또래','07또래'];
      return order.indexOf(a)-order.indexOf(b);
    }
    return a.localeCompare(b,'ko');
  });

  // 필터 바
  const fb=document.getElementById('filter-bar');
  fb.style.display='flex';
  fb.innerHTML=`<span class="filter-lbl">필터</span>`+
    `<div class="filter-chip ${!activeFilter?'active':''}" onclick="setFilter(null)">전체</div>`+
    keys.map(k=>`<div class="filter-chip ${activeFilter===k?'active':''}" onclick="setFilter('${k.replace(/'/g,"\\'")}')">
      ${k} <span style="color:#ccc">${groups[k].length}</span></div>`).join('');

  const show=activeFilter?{[activeFilter]:groups[activeFilter]}:groups;
  let html='';
  Object.entries(show).forEach(([k,list])=>{
    html+=`<div class="section-title">${k} (${list.length}명)</div>`;
    html+=renderGrid(list);
  });
  page.innerHTML=html||'<div class="loading">멤버가 없어요</div>';
}

function renderGrid(list){
  if(!list.length)return'<div class="loading">멤버가 없어요</div>';
  const adminMod=isAdmin?'admin-mode':'';
  return`<div class="members-grid ${adminMod}">${list.map(m=>renderCard(m)).join('')}</div>`;
}

function renderCard(m){
  const s=famStyle(m.fam);
  const roleColor=m.role==='리더'?'#e07aaa':m.role==='코리더'?'#a07ad0':m.role.includes('스탭')?'#60a0d0':'#bbb';
  return`<div class="member-card" onclick="showDetail('${m.docId}')">
    <div class="edit-actions">
      <button class="edit-btn edt" onclick="editMember(event,'${m.docId}')">✎</button>
      <button class="edit-btn del" onclick="deleteMember(event,'${m.docId}')">✕</button>
    </div>
    ${avatarHtml(m)}
    <div class="member-name">${m.name}</div>
    <div class="member-sub">${m.cell!=='미배정'?m.cell:m.fam}</div>
    <div class="role-badge" style="background:${s.bg};color:${s.color};">${m.role}</div>
  </div>`;
}

function setFilter(f){
  activeFilter=f;
  renderCurrentTab();
}

// ── 멤버 상세 ──
function showDetail(docId){
  const m=members.find(x=>x.docId===docId);
  if(!m)return;
  const s=famStyle(m.fam);
  const bigAv=m.photo
    ?`<div class="detail-avatar" style="background:${s.bg};"><img src="${m.photo}" onerror="this.style.display='none'"></div>`
    :`<div class="detail-avatar" style="background:${s.bg};color:${s.color};font-size:30px;font-weight:700;">${m.name.slice(0,2)}</div>`;
  document.getElementById('detail-box').innerHTML=`
    ${bigAv}
    <div class="detail-name">${m.name}</div>
    <div class="detail-info">${getAge(m.year)}세 (${m.year}년생) · ${m.gender}</div>
    <div class="detail-tags">
      <div class="detail-tag" style="background:${s.bg};color:${s.color};">${m.fam}</div>
      <div class="detail-tag" style="background:#f0eaf8;color:#805090;">${m.cell}</div>
      <div class="detail-tag" style="background:#f0f5ff;color:#4060c0;">${m.role}</div>
      <div class="detail-tag" style="background:#f5f5f5;color:#888;">${ageGroup(m.year)}</div>
    </div>
    <button class="close-btn" onclick="document.getElementById('detail-overlay').classList.remove('show')">닫기</button>
  `;
  document.getElementById('detail-overlay').classList.add('show');
}
function closeDetailIfBg(e){if(e.target===document.getElementById('detail-overlay'))document.getElementById('detail-overlay').classList.remove('show');}

// ── 관리자 ──
function openPinModal(){document.getElementById('pin-overlay').classList.add('show');setTimeout(()=>document.getElementById('p0').focus(),100);}
function closePinModal(){
  document.getElementById('pin-overlay').classList.remove('show');
  [0,1,2,3].forEach(i=>document.getElementById('p'+i).value='');
  document.getElementById('pin-err').style.display='none';
}
function nextPin(i){if(document.getElementById('p'+i).value&&i<3)document.getElementById('p'+(i+1)).focus();}
function backPin(e,i){
  if(e.key==='Backspace'&&!document.getElementById('p'+i).value&&i>0)document.getElementById('p'+(i-1)).focus();
  if(e.key==='Enter')checkPin();
}
function checkPin(){
  const pin=[0,1,2,3].map(i=>document.getElementById('p'+i).value).join('');
  if(pin===ADMIN_PIN){
    isAdmin=true; closePinModal();
    document.getElementById('admin-bar').classList.add('show');
    renderCurrentTab();
  }else{
    document.getElementById('pin-err').style.display='block';
    [0,1,2,3].forEach(i=>document.getElementById('p'+i).value='');
    document.getElementById('p0').focus();
  }
}
function doLogout(){
  isAdmin=false;
  document.getElementById('admin-bar').classList.remove('show');
  renderCurrentTab();
}

    document.getElementById('f-fam').value=m.fam;
    document.getElementById('f-cell').value=m.cell;
    document.getElementById('f-year').value=m.year;
    document.getElementById('f-gender').value=m.gender;
    document.getElementById('f-role').value=m.role;
    document.getElementById('f-photo').value=m.photo||'';
  }else{
    ['f-name','f-cell','f-role','f-photo'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f-fam').value='';
    document.getElementById('f-gender').value='';
    document.getElementById('f-year').value='';
  }
  document.getElementById('form-overlay').classList.add('show');
}
function closeForm(){document.getElementById('form-overlay').classList.remove('show');}
function toPhotoUrl(raw){
  if(!raw) return '';
  // 구글 드라이브 링크 자동 변환
  const m=raw.match(/\/d\/([^\/\?]+)/);
  if(m) return 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w200';
  return raw;
}
async function saveMember(){
  const name=document.getElementById('f-name').value.trim();
  const fam=document.getElementById('f-fam').value;
  const cell=document.getElementById('f-cell').value.trim()||'미배정';
  const year=parseInt(document.getElementById('f-year').value);
  const gender=document.getElementById('f-gender').value;
  const role=document.getElementById('f-role').value.trim()||'셀원';
  const photo=toPhotoUrl(document.getElementById('f-photo').value.trim());
  const docId=document.getElementById('f-docid').value;
  if(!name||!fam||!year){alert('이름, 팸, 출생연도는 필수예요');return;}
  const data={name,fam,cell,year,gender,role,photo};
  if(docId){
    await db.collection('members').doc(docId).update(data);
  }else{
    await db.collection('members').add(data);
  }
  closeForm();
}
function editMember(e,docId){e.stopPropagation();openMemberForm(docId);}
async function deleteMember(e,docId){
  e.stopPropagation();
  const m=members.find(x=>x.docId===docId);
  if(!confirm(`${m.name}님을 삭제할까요?`))return;
  await db.collection('members').doc(docId).delete();
}

// ── 퀴즈 ──
let qMode='all'; let qFilter=null;
let qQueue=[]; let qIdx=0; let qScore=0; let qTotal=0; let qStreak=0; let qAnswered=false;
const QUIZ_COUNT=10;

function setQuizMode(mode){
  qMode=mode; qFilter=null;
  document.querySelectorAll('.quiz-mode-btn').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('qm-'+mode);
  if(btn)btn.classList.add('active');
  renderQuizSubBar();
  startQuiz();
}
const AGE_ORDER=['98또래','99또래','00또래','01또래','02또래','03또래','04또래','05또래','06또래','07또래'];
function renderQuizSubBar(){
  const bar=document.getElementById('quiz-sub-bar');
  if(qMode==='all'){bar.innerHTML='';return;}
  const basePool=members.filter(m=>['종현팸','재호팸','향팸'].includes(m.fam));
  if(qMode==='age'){
    const ages=[...new Set(basePool.map(m=>ageGroup(m.year)))].sort((a,b)=>AGE_ORDER.indexOf(a)-AGE_ORDER.indexOf(b));
    bar.innerHTML=ages.map(a=>`<button class="quiz-mode-btn ${qFilter===a?'active':''}" onclick="setQuizFilter('${a}')">${a} (${basePool.filter(m=>ageGroup(m.year)===a).length})</button>`).join('');
  } else {
    const famPool=basePool.filter(m=>m.fam===qMode);
    const cells=[...new Set(famPool.map(m=>m.cell))].sort();
    bar.innerHTML=cells.map(c=>`<button class="quiz-mode-btn ${qFilter===c?'active':''}" onclick="setQuizFilter('${c.replace(/'/g,"\\'")}')"> ${c}</button>`).join('');
  }
}
function setQuizFilter(val){qFilter=val;renderQuizSubBar();startQuiz();}
function setQuizCell(c){setQuizFilter(c);}
function getQuizPool(){
  let pool=members.filter(m=>['종현팸','재호팸','향팸'].includes(m.fam));
  if(qMode==='age'){
    if(qFilter) pool=pool.filter(m=>ageGroup(m.year)===qFilter);
  } else if(qMode!=='all'){
    pool=pool.filter(m=>m.fam===qMode);
    if(qFilter) pool=pool.filter(m=>m.cell===qFilter);
  }
  return pool;
}

function startQuiz(){
  const pool=getQuizPool();
  document.getElementById('quiz-result').style.display='none';
  document.getElementById('quiz-main').style.display='block';
  if(pool.length<2){
    document.getElementById('q-opts').innerHTML='<div style="grid-column:1/-1;text-align:center;color:#bbb;padding:20px;font-size:14px;">멤버가 2명 이상 필요해요</div>';
    return;
  }
  qScore=0; qTotal=0; qStreak=0; qIdx=0;
  qQueue=shuffle([...pool]).slice(0,Math.min(QUIZ_COUNT,pool.length));
  updateQuizBar(); nextQuestion();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function updateQuizBar(){
  document.getElementById('q-score').textContent=qScore;
  document.getElementById('q-total').textContent=qTotal;
  document.getElementById('q-streak').textContent=qStreak;
  document.getElementById('q-num').textContent=qQueue.length?`${qIdx}/${qQueue.length}`:'';
  document.getElementById('q-prog').style.width=qQueue.length?Math.round(qIdx/qQueue.length*100)+'%':'0%';
}
function nextQuestion(){
  document.getElementById('q-next').classList.remove('show');
  document.getElementById('q-fb').textContent='';
  document.getElementById('q-fb').className='quiz-feedback';
  if(qIdx>=qQueue.length){showQuizResult();return;}
  const cur=qQueue[qIdx]; qAnswered=false;
  const s=famStyle(cur.fam);
  const av=document.getElementById('q-avatar');
  av.style.background=s.bg; av.style.color=s.color; av.style.fontSize='36px';
  av.innerHTML=cur.photo?`<img src="${cur.photo}" onerror="this.style.display='none'">`:`<span>${cur.name.slice(0,2)}</span>`;
  document.getElementById('q-hint').textContent=`${cur.fam} · ${cur.cell} · ${getAge(cur.year)}세`;
  const allPool=getQuizPool();
  const wrongs=shuffle(allPool.filter(m=>m.docId!==cur.docId)).slice(0,3);
  const opts=shuffle([cur,...wrongs]);
  document.getElementById('q-opts').innerHTML=opts.map(m=>
    `<button class="option-btn" id="qopt-${m.docId}" onclick="chooseAnswer('${m.docId}','${cur.docId}')">${m.name}</button>`
  ).join('');
  qIdx++; updateQuizBar();
}
function chooseAnswer(chosen,correct){
  if(qAnswered)return; qAnswered=true; qTotal++;
  const ok=chosen===correct;
  document.querySelectorAll('.option-btn').forEach(b=>b.disabled=true);
  document.getElementById('qopt-'+chosen).classList.add(ok?'correct':'wrong');
  if(!ok)document.getElementById('qopt-'+correct).classList.add('reveal');
  const fb=document.getElementById('q-fb');
  if(ok){qScore++;qStreak++;fb.className='quiz-feedback ok';fb.textContent=qStreak>=3?`${qStreak}연속 정답! 🔥`:['정답! 🎉','맞아요! 🎉','완벽해요! ✨'][Math.floor(Math.random()*3)];}
  else{qStreak=0;fb.className='quiz-feedback ng';const m=members.find(x=>x.docId===correct);fb.textContent=`아쉬워요! 정답은 ${m?m.name:'?'}이에요`;}
  updateQuizBar();
  const nb=document.getElementById('q-next');
  nb.textContent=qIdx>=qQueue.length?'결과 보기':'다음 문제';
  nb.classList.add('show');
}
function showQuizResult(){
  document.getElementById('quiz-main').style.display='none';
  const rs=document.getElementById('quiz-result');
  rs.style.display='block';
  const pct=Math.round(qScore/qQueue.length*100);
  let emoji,title,sub;
  if(pct===100){emoji='🏆';title='완벽해요!';sub='모든 지체를 다 외웠군요!';}
  else if(pct>=80){emoji='🎉';title='훌륭해요!';sub='거의 다 외웠어요. 조금만 더!';}
  else if(pct>=60){emoji='😊';title='잘했어요!';sub='조금씩 더 친해지고 있어요';}
  else if(pct>=40){emoji='💪';title='더 연습해 봐요!';sub='반복하다 보면 금방 외울 수 있어요';}
  else{emoji='🌱';title='아직 낯설군요!';sub='매일 조금씩 얼굴을 익혀봐요';}
  document.getElementById('r-emoji').textContent=emoji;
  document.getElementById('r-title').textContent=title;
  document.getElementById('r-score').textContent=`${qScore} / ${qQueue.length}`;
  document.getElementById('r-sub').textContent=sub;
}

// ── 시작 ──
startFirebaseListener();
</script>
